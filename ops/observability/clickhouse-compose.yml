services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: agentdb
      CLICKHOUSE_USER: agentdb
      CLICKHOUSE_PASSWORD: agentdb
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  clickhouse-data:
