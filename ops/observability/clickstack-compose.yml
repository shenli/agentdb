services:
  clickstack:
    image: docker.hyperdx.io/hyperdx/hyperdx-all-in-one:latest
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
    environment:
      HYPERDX_LOG_LEVEL: info
      USAGE_STATS_ENABLED: "false"
    volumes:
      - clickstack-data:/data

volumes:
  clickstack-data:
