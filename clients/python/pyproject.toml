[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentdb"
version = "2.0.0"
description = "Python client for AgentDB — agent-native operational database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgentDB contributors" }]
keywords = ["agentdb", "agent", "database", "memory", "session"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
async = [
    "httpx>=0.27",
]
test = [
    "pytest>=7.0",
    # Async smoke tests `import httpx` directly via AsyncClient,
    # so `[test]` needs httpx too. Picks up the same constraint
    # as the runtime extra.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/shenli/agentdb"
Documentation = "https://github.com/shenli/agentdb/blob/main/docs/architecture/implementation-architecture.md"
Source = "https://github.com/shenli/agentdb"

[tool.hatch.build.targets.wheel]
packages = ["agentdb"]
