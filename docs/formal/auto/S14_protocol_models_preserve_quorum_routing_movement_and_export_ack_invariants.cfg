SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Owners = {o1, o2}
    Cursors = {c1, c2}
    Tablets = {t1, t2}
    Quorum = 2
    MaxEpoch = 1

INVARIANTS
    TypeOK
    NoAckBeforeSinkAccept
    NoCommittedWriteWithoutQuorum
    NoApplyBeforeCommit
    NoAppliedEpochExceedsCurrentEpoch
    NoLostCommittedKeyDuringMovement
    NoTwoActiveOwnersForSameTabletEpoch
    StaleRetriesStayBelowCurrentEpoch
