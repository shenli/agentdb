[workspace]
resolver = "2"
members = [
    "crates/agentdb-storage",
    "crates/agentdb-core",
    "crates/agentdb-api",
    "crates/agentdb-dashboard",
    "crates/agentdb-index",
    "crates/agentdb-wire",
    "bin/agentdb-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-broadcast = "0.7"
bson = { version = "3", features = ["serde"] }
bytes = "1"
byteorder = "1"
instant-distance = "0.6"
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-3-0"] }
parking_lot = "0.12"
thiserror = "1"
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util", "time"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serial_test = "3"
object_store = "0.11"
