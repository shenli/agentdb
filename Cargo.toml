[workspace]
resolver = "2"
members = [
    "crates/agentdb-storage",
    "crates/agentdb-core",
    "crates/agentdb-api",
    "crates/agentdb-wire",
    "crates/agentdb-dashboard",
    "crates/agentdb-index",
    "crates/agentdb-meta",
    "bin/agentdbctl",
    "bin/agentdb-server",
    "tools/agentdb-bench",
    "tools/agentdb-cluster-smoke",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-broadcast = "0.7"
bytes = "1"
byteorder = "1"
bson = "2"
instant-distance = "0.6"
parking_lot = "0.12"
thiserror = "1"
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util", "time"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serial_test = "3"
object_store = { version = "0.12", features = ["aws"] }
slatedb = "0.12.1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
# M19 auth primitives. SCRAM-SHA-256 is RFC 5802 / RFC 7677;
# implemented from SHA-256 + HMAC + PBKDF2 rather than pulling a
# full SASL crate (keeps the dep surface narrow and the crypto
# auditable).
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.22"
subtle = "2"
async-trait = "0.1"
protobuf = "2"
prost = "0.11"
raft = { version = "0.7", default-features = false, features = ["prost-codec"] }
raft-engine = "0.4"
slog = "2"
# REST TLS termination.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2"
# Dev-only: generate ephemeral self-signed certs for
# `agentdb serve --dev-tls` and integration tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
mongodb = { version = "2.8.2", default-features = false, features = ["tokio-runtime"] }
mimalloc = "0.1"
