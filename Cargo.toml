[workspace]
resolver = "2"
members = [
    "crates/agentdb-storage",
    "crates/agentdb-core",
    "crates/agentdb-api",
    "crates/agentdb-wire",
    "bin/agentdb-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
bson = "2"
bytes = "1"
byteorder = "1"
mongodb = { version = "2", default-features = false, features = ["tokio-runtime"] }
thiserror = "1"
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net"] }
axum = "0.7"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serial_test = "3"
