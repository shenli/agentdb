[package]
name = "agentdb-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentdb-core = { path = "../agentdb-core" }
agentdb-dashboard = { path = "../agentdb-dashboard" }
agentdb-meta = { path = "../agentdb-meta" }
async-broadcast = { workspace = true }
axum = { workspace = true }
# Phase-1 pub/sub Task 4: `Query` from axum-extra uses
# `serde_html_form` and decodes repeated keys
# (`?kind=a&kind=b`) into `Vec<String>`. The default
# axum `Query` (`serde_urlencoded`) cannot. Pinned to the
# 0.9 line — it tracks axum 0.7.
axum-extra = { version = "0.9", features = ["query"] }
base64 = { workspace = true }
subtle = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
agentdb-storage = { path = "../agentdb-storage" }
anyhow = { workspace = true }
object_store = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry_sdk = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
