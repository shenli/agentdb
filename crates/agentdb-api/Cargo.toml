[package]
name = "agentdb-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentdb-core = { path = "../agentdb-core" }
agentdb-dashboard = { path = "../agentdb-dashboard" }
agentdb-meta = { path = "../agentdb-meta" }
async-broadcast = { workspace = true }
axum = { workspace = true }
# Phase-1 pub/sub Task 4: `Query` from axum-extra uses
# `serde_html_form` and decodes repeated keys
# (`?kind=a&kind=b`) into `Vec<String>`. The default
# axum `Query` (`serde_urlencoded`) cannot. Pinned to the
# 0.9 line — it tracks axum 0.7.
axum-extra = { version = "0.9", features = ["query"] }
base64 = { workspace = true }
subtle = { workspace = true }
futures-util = "0.3"
# Phase-1 pub/sub Task 9a: JWT verification for browser-direct
# subscribers. HS256 in this task; RS256/ES256 via JWKS in 9b.
jsonwebtoken = "9"
# Phase-1 pub/sub Task 9b: JWKS keyset cache uses a process-global
# `Lazy<JwksCache>` keyed by URL. `once_cell` is the standard
# crate; `std::sync::OnceLock` would also work but `Lazy` reads
# cleaner for this shape.
once_cell = "1"
reqwest = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
agentdb-storage = { path = "../agentdb-storage" }
anyhow = { workspace = true }
object_store = { workspace = true }
# Task 9b JWKS test mints an RSA-signed JWT against a local stub
# server. `rsa` here is dev-only — runtime verification uses
# `jsonwebtoken::DecodingKey::from_rsa_components`. `base64` is
# already a runtime dep (Task 5 catch-up scan), so reused here.
rsa = "0.9"
rand = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry_sdk = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
