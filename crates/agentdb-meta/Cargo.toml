[package]
name = "agentdb-meta"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# SQLite-first for M18. Postgres support is added in a follow-up PR
# once M19 has a consumer that needs it. Keeping sqlx's "postgres"
# feature disabled here means workspace-wide builds don't pull in the
# heavier pg-protocol dep tree yet.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "chrono",
] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
