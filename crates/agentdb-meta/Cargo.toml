[package]
name = "agentdb-meta"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Dual-dialect: SQLite for dev / single-node, Postgres for
# production multi-node (LISTEN/NOTIFY-driven change
# propagation, wider ops tooling). `AGENTDB_META_BACKEND`
# selects at runtime; see `MetaBackend` in lib.rs.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "any",
    "macros",
    "chrono",
] }
# tokio-stream: the Postgres LISTEN/NOTIFY plumbing uses a
# stream of notifications as the change-propagation signal.
tokio-stream = { version = "0.1", features = ["sync"] }
# futures: used in the LISTEN loop + tests.
futures = "0.3"
thiserror = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
# M19 auth: SCRAM-SHA-256 credential derivation + verification.
rand = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
# utoipa so the RBAC scope enum can be rendered in the OpenAPI
# spec alongside the admin-token DTOs.
utoipa = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
