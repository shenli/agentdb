# Single-node AgentDB stack.
#
# Bring it up:
#   cd examples/compose
#   docker compose up --build
#
# Then:
#   curl http://localhost:7878/health/ready
#   open http://localhost:7878/dashboard
#
# Tear down:
#   docker compose down        # keep the named volume
#   docker compose down -v     # wipe persisted AgentDB state

services:
  agentdb:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      AGENTDB_BIND: 0.0.0.0:7878
      AGENTDB_DATA_DIR: /data/runtime
      AGENTDB_CONTENT_DIR: /data/content
      RUST_LOG: info
    ports:
      - "7878:7878"
    volumes:
      - agentdb-data:/data

volumes:
  agentdb-data:
