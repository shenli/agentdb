# AgentDB docker-compose stack with MinIO.
#
# This file ships a single-node stack by default. Multi-node is
# now supported — both nodes can share the same meta store and
# the scheduler-leader's `TabletPlacement` loop spreads the
# `AGENTDB_BOXES` tablets across alive nodes round-robin. See
# `docs/ARCHITECTURE.md` ("Tablet placement and reconciliation")
# for the design and `crates/agentdb-core/src/tablet_placement.rs`
# for the leader-owned placement loop.
#
# To run two nodes against the same Postgres meta store, copy
# the `agentdb` block, give each node a unique `AGENTDB_NODE_ID`
# and host port, and point both at the same `AGENTDB_META_URL`.
# The first node to win leader election seeds the tablets and
# distributes them; the other reconciler picks up its share
# within ~one tick.
#
# What you get:
#   * One AgentDB node on :7878 (REST + /dashboard + /metrics).
#   * MinIO on :9000 (S3 API) and :9001 (web console at
#     http://localhost:9001, user `minio` / password `minio123`).
#   * SlateDB KV layered on top of MinIO, so every byte of warm /
#     cold state goes through the S3-compatible path. This is the
#     production shape — rocksdb-local is the dev path.
#
# Bring it up:
#   cd examples/compose
#   docker compose up --build
# Then:
#   curl http://localhost:7878/health/ready
#   curl http://localhost:7878/metrics | head -20
#   open http://localhost:7878/dashboard
#   open http://localhost:9001           # MinIO console
#
# Tear down:
#   docker compose down -v               # -v wipes volumes
#
# A bind mount for the local meta.sqlite isn't needed — the
# volume below persists across `up -d` cycles. `down -v` removes
# it.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - minio-data:/data

  # One-shot sidecar: create the agentdb bucket before the server
  # starts. MinIO's `mc` alias + `mb --ignore-existing` is
  # idempotent — subsequent `up` cycles are no-ops.
  minio-bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/agentdb &&
      echo 'bucket ready'
      "

  agentdb:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      minio-bucket-init:
        condition: service_completed_successfully
    environment:
      # Use MinIO as the S3-compatible object store.
      AGENTDB_OBJECT_STORE: s3
      AGENTDB_S3_BUCKET: agentdb
      AGENTDB_S3_REGION: us-east-1
      AGENTDB_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123

      # Layer SlateDB on top so warm KV lives in S3 too (production
      # shape). Comment out to use local-disk RocksDB instead.
      AGENTDB_KV_BACKEND: slatedb
      AGENTDB_SLATEDB_PATH: agentdb/slate

      # Control-plane: meta.sqlite lives on the named volume so
      # leases + scheduler state persist across compose down/up
      # (without `-v`).
      AGENTDB_META_PATH: /data/meta.sqlite

      # Friendly node id for the admin views.
      AGENTDB_NODE_ID: compose-node
      AGENTDB_NODE_ADDRESS: 0.0.0.0:7878

      RUST_LOG: info
    ports:
      - "7878:7878"   # REST + /dashboard + /metrics
    volumes:
      - agentdb-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/agentdb", "show-scheduler", "--server-url", "http://localhost:7878"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Postgres meta-store backend. Off by default; bring it up
  # with the "postgres" compose profile:
  #
  #     docker compose --profile postgres up postgres
  #
  # …then point `agentdb` at it by exporting these in your
  # shell before the main `up` or by dropping them into a
  # `docker-compose.override.yml`:
  #
  #     services:
  #       agentdb:
  #         depends_on:
  #           postgres:
  #             condition: service_healthy
  #         environment:
  #           AGENTDB_META_BACKEND: postgres
  #           AGENTDB_META_URL: postgres://agentdb:agentdb@postgres:5432/agentdb_meta
  #
  # Migrations run on first start; subsequent restarts are
  # idempotent. Change-propagation uses PG LISTEN/NOTIFY
  # automatically.
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: agentdb
      POSTGRES_PASSWORD: agentdb
      POSTGRES_DB: agentdb_meta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdb -d agentdb_meta"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  minio-data:
  agentdb-data:
  postgres-data:
