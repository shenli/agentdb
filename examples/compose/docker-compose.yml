# Single-node AgentDB stack.
#
# Bring it up:
#   cd examples/compose
#   export AGENTDB_API_AUTH_TOKEN='replace-with-at-least-16-characters'
#   docker compose up --build
#
# Then:
#   curl http://localhost:7878/health/ready
#   open http://localhost:7878/dashboard
#
# Tear down:
#   docker compose down        # keep the named volume
#   docker compose down -v     # wipe persisted AgentDB state

services:
  agentdb:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      AGENTDB_API_AUTH_TOKEN: ${AGENTDB_API_AUTH_TOKEN:?set AGENTDB_API_AUTH_TOKEN to at least 16 visible ASCII characters without whitespace}
    volumes:
      - agentdb-data:/data

volumes:
  agentdb-data:
