# AgentDB single-node docker-compose stack with MinIO.
#
# Why single-node and not a multi-node cluster: the current
# architecture acquires a lease for every tablet (0..AGENTDB_BOXES)
# at boot, and two nodes sharing a meta store would race for the
# same tablet ids. Multi-node requires the M20 shard/tablet
# refactor (see docs/agent-db-v2.md §3 and the plan doc) — tracked,
# not implemented.
#
# What you get:
#   * One AgentDB node on :7878 (REST + /dashboard + /metrics)
#     and :7879 (Mongo wire protocol subset).
#   * MinIO on :9000 (S3 API) and :9001 (web console at
#     http://localhost:9001, user `minio` / password `minio123`).
#   * SlateDB KV layered on top of MinIO, so every byte of warm /
#     cold state goes through the S3-compatible path. This is the
#     production shape — rocksdb-local is the dev path.
#
# Bring it up:
#   cd examples/compose
#   docker compose up --build
# Then:
#   curl http://localhost:7878/health/ready
#   curl http://localhost:7878/metrics | head -20
#   open http://localhost:7878/dashboard
#   open http://localhost:9001           # MinIO console
#
# Tear down:
#   docker compose down -v               # -v wipes volumes
#
# A bind mount for the local meta.sqlite isn't needed — the
# volume below persists across `up -d` cycles. `down -v` removes
# it.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - minio-data:/data

  # One-shot sidecar: create the agentdb bucket before the server
  # starts. MinIO's `mc` alias + `mb --ignore-existing` is
  # idempotent — subsequent `up` cycles are no-ops.
  minio-bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/agentdb &&
      echo 'bucket ready'
      "

  agentdb:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      minio-bucket-init:
        condition: service_completed_successfully
    environment:
      # Use MinIO as the S3-compatible object store.
      AGENTDB_OBJECT_STORE: s3
      AGENTDB_S3_BUCKET: agentdb
      AGENTDB_S3_REGION: us-east-1
      AGENTDB_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123

      # Layer SlateDB on top so warm KV lives in S3 too (production
      # shape). Comment out to use local-disk RocksDB instead.
      AGENTDB_KV_BACKEND: slatedb
      AGENTDB_SLATEDB_PATH: agentdb/slate

      # Control-plane: meta.sqlite lives on the named volume so
      # leases + scheduler state persist across compose down/up
      # (without `-v`).
      AGENTDB_META_PATH: /data/meta.sqlite

      # Friendly node id for the admin views.
      AGENTDB_NODE_ID: compose-node
      AGENTDB_NODE_ADDRESS: 0.0.0.0:7878

      RUST_LOG: info
    ports:
      - "7878:7878"   # REST + /dashboard + /metrics
      - "7879:7879"   # Mongo wire
    volumes:
      - agentdb-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/agentdb", "show-scheduler", "--server-url", "http://localhost:7878"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  minio-data:
  agentdb-data:
