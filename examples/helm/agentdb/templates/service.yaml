apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentdb.fullname" . }}
  labels:
    app.kubernetes.io/name: agentdb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: {{ .Values.service.restPort }}
      targetPort: rest
  selector:
    app.kubernetes.io/name: agentdb
    app.kubernetes.io/instance: {{ .Release.Name }}
