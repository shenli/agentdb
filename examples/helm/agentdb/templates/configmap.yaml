apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentdb.fullname" . }}-config
  labels:
    app.kubernetes.io/name: agentdb
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  agentdb.toml: |
    [server]
    bind = "0.0.0.0:{{ .Values.service.restPort }}"
    dev = false

    [storage]
    data_dir = "/data/runtime"
    content_dir = "/data/content"
