apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentdb.fullname" . }}
  labels:
    app.kubernetes.io/name: agentdb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "agentdb.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentdb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentdb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agentdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config
            - /etc/agentdb/agentdb.toml
          env:
            - name: AGENTDB_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required" .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.tokenKey | quote }}
          ports:
            - name: rest
              containerPort: {{ .Values.service.restPort }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: rest
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/agentdb
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "agentdb.fullname" . }}-config
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
