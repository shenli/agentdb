# AgentDB Helm values.
#
# This chart targets a single-node evaluation on a kubernetes
# cluster. Multi-node clustering needs the shard-per-tablet
# lease story plus a shared meta store — not modeled here.

image:
  repository: ghcr.io/shenli/agentdb
  # Tag ships with the chart so a fresh pull from the chart
  # never surprises an operator with `:latest` drift.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Resources default to a conservative shape that fits on a
# laptop k3d cluster. Bump for real workloads.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

service:
  # REST (+ dashboard).
  restPort: 7878

# Persistent storage: 10Gi for RocksDB runtime metadata and local artifact
# content.
persistence:
  enabled: true
  size: 10Gi
  # Leave storageClassName empty to use the cluster default.
  storageClassName: ""
