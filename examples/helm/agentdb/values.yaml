# AgentDB Helm values.
#
# This chart targets a single-node evaluation on a kubernetes
# cluster. Multi-node clustering needs the shard-per-tablet
# lease story plus a shared meta store — not modeled here.

image:
  repository: ghcr.io/shenli/agentdb
  # Tag ships with the chart so a fresh pull from the chart
  # never surprises an operator with `:latest` drift.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Resources default to a conservative shape that fits on a
# laptop k3d cluster. Bump for real workloads.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

service:
  # REST (+ dashboard).
  restPort: 7878

# The chart never places bearer credentials in a ConfigMap or generated
# manifest. Create a Secret and name it here; the value must contain at least
# 16 visible ASCII characters with no whitespace because the pod listens on a
# non-loopback address.
auth:
  existingSecret: ""
  tokenKey: api-token

# Persistent storage: 10Gi for RocksDB runtime metadata and local artifact
# content.
persistence:
  enabled: true
  size: 10Gi
  # Leave storageClassName empty to use the cluster default.
  storageClassName: ""

# Bounded tablet-store domains. Keep these conservative for small Kubernetes
# nodes; the mutable memtable budget is approximately
# maxOpenDomains * domainWriteBufferSizeMiB * domainMaxWriteBuffers.
tabletStore:
  layout: grouped_rocksdb
  rootDir: /data/runtime/tablet-stores
  # Use 1 only for high-isolation tablet checkpoint/restore tests and lower
  # maxOpenDomains accordingly to keep memtables bounded.
  tabletsPerDomain: 32
  maxOpenDomains: 16
  domainWriteBufferSizeMiB: 16
  domainMaxWriteBuffers: 2
  domainParallelism: 1
  domainMaxBackgroundJobs: 1
  domainMaxOpenFiles: 128
