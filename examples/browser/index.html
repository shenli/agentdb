<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AgentDB browser-direct demo</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    .ev { padding: .5rem; border-bottom: 1px solid #eee; font-family: ui-monospace, monospace; font-size: .9rem; }
    button { padding: .5rem 1rem; margin-right: .5rem; }
    input { padding: .5rem; width: 50%; }
    .status { color: #666; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>AgentDB browser-direct subscription</h1>
  <p class="status" id="status">Connecting…</p>
  <p>Subscribed to <code>tenant=t-1, session=s-demo</code>. Append events from this page or via the API; they stream in below.</p>

  <div>
    <input id="msg" placeholder="message text" value="hello"/>
    <button id="send">Append</button>
  </div>

  <h3>Events</h3>
  <div id="events"></div>

  <script type="module">
    // The token is injected by `mint_token.py` into a copy of this
    // file (see README). Running the raw `index.html` will display
    // a "no token" message instead of trying to subscribe.
    const TOKEN = window.AGENTDB_TOKEN;
    const BASE_URL = "http://127.0.0.1:7878";
    const TENANT = "t-1";
    const SESSION = "s-demo";

    function setStatus(s) { document.getElementById("status").textContent = s; }

    async function append(text) {
      const r = await fetch(`${BASE_URL}/api/tenants/${TENANT}/sessions/${SESSION}/append_and_fetch`, {
        method: "POST",
        headers: { "content-type": "application/json", "authorization": `Bearer ${TOKEN}` },
        body: JSON.stringify({ event: { kind: "message", text }, fetch_last_n: 0 }),
      });
      if (!r.ok) console.error("append failed", r.status, await r.text());
    }

    async function subscribe() {
      const url = `${BASE_URL}/api/tenants/${TENANT}/sessions/${SESSION}/subscribe`;
      const resp = await fetch(url, { headers: { authorization: `Bearer ${TOKEN}` } });
      if (!resp.ok) {
        setStatus(`subscribe failed: ${resp.status}`);
        return;
      }
      setStatus("Connected. Streaming events…");
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) { setStatus("Stream closed."); break; }
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          render(block);
        }
      }
    }

    function render(block) {
      let evt = null, data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith(":")) continue;
        if (line.startsWith("event:")) evt = line.slice(6).trim();
        else if (line.startsWith("data:")) {
          if (data.length > 0) data += "\n";
          data += line.slice(5).replace(/^ /, "");
        }
      }
      if (evt === "subscribed") {
        const meta = JSON.parse(data);
        setStatus(`Subscribed (live_seq=${meta.live_seq})`);
        return;
      }
      if (evt === "error") {
        setStatus(`Server error: ${data}`);
        return;
      }
      if (!data) return;
      const env = JSON.parse(data);
      const div = document.createElement("div");
      div.className = "ev";
      div.textContent = `seq=${env.seq} kind=${env.kind} payload=${JSON.stringify(env.payload)}`;
      document.getElementById("events").appendChild(div);
    }

    document.getElementById("send").onclick = () => append(document.getElementById("msg").value);
    if (TOKEN) {
      subscribe().catch(e => { console.error(e); setStatus(`error: ${e.message}`); });
    } else {
      setStatus("No token. Run: python mint_token.py > demo.html, then open demo.html.");
    }
  </script>
</body>
</html>
