# AgentDB single-node configuration.
#
# Run with:
#   agentdb doctor --config config/agentdb.toml
#   agentdb serve --config config/agentdb.toml

[deployment]
mode = "single_node" # or "cluster"

[server]
bind = "127.0.0.1:7878"
# dev = true uses ephemeral in-memory state.
dev = false
# Required for cluster mode internal Raft RPCs. Prefer setting
# AGENTDB_INTERNAL_AUTH_TOKEN in production instead of committing a secret.
# internal_auth_token = "change-me-min-16-chars"

[mongodb]
# Optional MongoDB wire-protocol compatibility listener.
# This is a narrow AgentDB adapter for driver/tool access, not full MongoDB.
# bind = "127.0.0.1:7879"
# Optional MongoDB PLAIN authentication. You can also set
# AGENTDB_MONGODB_USERNAME and AGENTDB_MONGODB_PASSWORD.
# username = "agentdb"
# password = "change-me"

[storage]
data_dir = "./agentdb-data"
# content_dir defaults to "<data_dir>/content" when omitted.
# content_dir = "./agentdb-data/content"

[storage.kv]
backend = "rocksdb" # or "slatedb"

# Support matrix:
# - single_node + rocksdb + localfs: primary supported deployment
# - single_node + slatedb + s3: testing/evaluation
# - cluster + slatedb + s3: target clustered deployment
#
# Cluster mode requirements:
# - deployment.mode = "cluster"
# - storage.kv.backend = "slatedb"
# - storage.content.backend = "object_store"
# - storage.object_store.backend = "s3"
# - routing.node_id must be set
# - server.internal_auth_token or AGENTDB_INTERNAL_AUTH_TOKEN must be set

# Shared object-store config. Required when:
# - storage.kv.backend = "slatedb"
# - storage.content.backend = "object_store"
# Fixed internal prefixes are used automatically:
# - KV / SlateDB:     agentdb/runtime
# - Content / blobs:  agentdb/content
# [storage.object_store]
# backend = "s3" # or "localfs" for local testing
# bucket = "my-agentdb"
# region = "us-west-2"
# endpoint = "http://127.0.0.1:9000" # optional, useful for MinIO
# allow_http = true                   # optional, useful for MinIO
# local_root = "./agentdb-data/object-store" # for backend = "localfs"

[storage.content]
backend = "localfs" # or "object_store"

[routing]
# Required in cluster mode.
# node_id = "node-a"
# Logical isolation cell for this node. Use the same value for nodes that
# should share tablet placement and rebalance.
cell_id = "default"
# Region and AZ labels used by routing status and replica placement.
# region = "us-west-2"
# availability_zone = "us-west-2a"
# stable, mixed, or preemptible.
capacity_class = "stable"
