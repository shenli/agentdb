# AgentDB single-node configuration.
#
# This is the primary supported deployment: one process, local RocksDB metadata,
# and local artifact storage. Every value below has a sensible default, so an
# empty file (or no file at all) runs a working single-node server.
#
# Run with:
#   agentdb doctor --config config/agentdb.toml
#   agentdb serve  --config config/agentdb.toml
#
# For a clustered / object-store deployment, see config/agentdb.cluster.toml.

[deployment]
mode = "single_node"

[server]
bind = "127.0.0.1:7878"
# dev = true uses ephemeral in-memory state (lost on shutdown).
dev = false
# A non-loopback HTTP bind requires a bearer token. Prefer setting
# AGENTDB_API_AUTH_TOKEN instead of committing the token. During a rotation, set
# AGENTDB_API_AUTH_PREVIOUS_TOKEN temporarily and remove it after every client
# has switched. Both values must be at least 16 visible ASCII characters with no
# whitespace; the previous token requires a current token and must differ from it.
# api_auth_token = "change-me-min-16-chars"
# api_auth_previous_token = "old-token-min-16-chars"

[storage]
# Omit data_dir to use the machine-scoped default ($AGENTDB_HOME, then
# $XDG_DATA_HOME/agentdb, then ~/.agentdb). To pin a location, set an ABSOLUTE
# path here (the loader does not expand ~).
# data_dir = "/var/lib/agentdb"
# content_dir defaults to "<data_dir>/content" when omitted.
# content_dir = "/var/lib/agentdb/content"
# Advisory disk budget for the data directory, in GiB (default 20). Shown in the
# startup banner and GET /api/storage/disk; over ~80% the dashboard warns. This
# never blocks writes — it is a signal, not a hard cap.
# disk_budget_gib = 20

[storage.kv]
backend = "rocksdb"

[storage.content]
backend = "localfs"

[storage.tablet]
# grouped_rocksdb places hot tablet state in bounded local RocksDB domains.
# prefix_scoped remains available for local development and narrow debugging.
layout = "grouped_rocksdb" # or "prefix_scoped"
# root_dir defaults to "<data_dir>/tablet-stores".
# root_dir = "/var/lib/agentdb/tablet-stores"
# Number of tablets sharing one RocksDB domain. Use 1 only for explicit
# high-isolation testing; larger values cap memtable count.
tablets_per_domain = 32
# Maximum idle grouped RocksDB domains a node keeps open. Rough mutable-memtable
# budget = max_open_domains * domain_write_buffer_size_mib * domain_max_write_buffers.
max_open_domains = 16
domain_write_buffer_size_mib = 16
domain_max_write_buffers = 2
domain_parallelism = 1
domain_max_background_jobs = 1
domain_max_open_files = 128

# Tenant envelope encryption (optional, opt-in). See
# docs/operations/single-node-production-checklist.md for the KEK and KMS options.
# Set via environment, not this file:
#   AGENTDB_ENCRYPTION_MODE=envelope
#   AGENTDB_ENCRYPTION_KEK_SECRET=<high-entropy secret>   # or KEK_PROVIDER=command
