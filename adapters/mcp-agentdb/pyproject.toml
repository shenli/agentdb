[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-agentdb"
version = "0.1.0"
description = "MCP stdio server exposing AgentDB sessions, artifacts, records, and replay"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgentDB contributors" }]
dependencies = [
    "agentdb>=2.0.0",
]

[project.scripts]
agentdb-mcp = "agentdb_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["agentdb_mcp"]
