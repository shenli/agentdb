[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-agentdb"
version = "0.1.0"
description = "LangGraph checkpoint and store adapter for AgentDB"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgentDB contributors" }]
dependencies = [
    "agentdb[async]>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["langgraph_checkpoint_agentdb"]
