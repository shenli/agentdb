name: distributed-tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Distributed test profile"
        required: true
        default: nightly
        type: choice
        options:
          - quick
          - nightly
          - release
  schedule:
    # Nightly at 09:17 UTC. The odd minute avoids the top-of-hour queue.
    - cron: "17 9 * * *"

concurrency:
  group: distributed-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUST_LOG: warn
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  DIST_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.profile }}

jobs:
  quick-auto:
    name: quick auto suites
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: distributed-quick-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            distributed-quick-${{ runner.os }}-
            cargo-ci-${{ runner.os }}-

      - name: Run authored auto suites
        run: |
          cargo test -q -p agentdb-core --test auto
          cargo test -q -p agentdb-api --test auto
          cargo test -q -p agentdb-wire

  s11-fuzz-smoke:
    name: S11 fuzz smoke
    if: ${{ github.event_name == 'schedule' || inputs.profile != 'quick' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup show

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run S11 fuzz target
        working-directory: crates/agentdb-wire
        run: |
          RUNS=250000
          if [[ "$DIST_PROFILE" == "release" ]]; then
            RUNS=5000000
          fi
          cargo +nightly fuzz run S11_wire_sdk_adapter_and_config_boundaries -- -runs="$RUNS"

  s8-cluster-failover:
    name: S8 cluster failover
    if: ${{ github.event_name == 'schedule' || inputs.profile != 'quick' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup show

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Run S8
        run: |
          RUN_TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SESSION_DIR="$GITHUB_WORKSPACE/test-sessions/s8-nightly-${RUN_TS}"
          mkdir -p "$SESSION_DIR"
          AGENTDB_RUN_AUTHOR_CLUSTER=1 \
          AGENTDB_DIST_SESSION_DIR="$SESSION_DIR" \
          AGENTDB_CLUSTER_SMOKE_WORK_DIR="$RUNNER_TEMP/agentdb-s8-${RUN_TS}" \
          bash ops/smoke/tests/auto/S8_raft_quorum_preserves_acknowledged_tablet_writes_under_partition.sh

      - name: Upload S8 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s8-cluster-failover
          path: |
            test-sessions/s8-nightly-*
            ${{ runner.temp }}/agentdb-s8-*

  s9-cluster-hardening:
    name: S9 cluster hardening
    if: ${{ github.event_name == 'schedule' || inputs.profile != 'quick' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup show

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Run S9
        run: |
          RUN_TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SESSION_DIR="$GITHUB_WORKSPACE/test-sessions/s9-nightly-${RUN_TS}"
          mkdir -p "$SESSION_DIR"
          AGENTDB_RUN_AUTHOR_HARDENING=1 \
          AGENTDB_DIST_SESSION_DIR="$SESSION_DIR" \
          AGENTDB_CLUSTER_SMOKE_WORK_DIR="$RUNNER_TEMP/agentdb-s9-${RUN_TS}" \
          bash ops/smoke/tests/auto/S9_tablet_replacement_split_merge_preserves_state_idempotency_and_cursors.sh

      - name: Upload S9 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s9-cluster-hardening
          path: |
            test-sessions/s9-nightly-*
            ${{ runner.temp }}/agentdb-s9-*

  s13-benchmark-smoke:
    name: S13 benchmark gate
    if: ${{ github.event_name == 'schedule' || inputs.profile != 'quick' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup show

      - name: Run S13
        run: |
          RUN_TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SESSION_DIR="$GITHUB_WORKSPACE/test-sessions/s13-${DIST_PROFILE}-${RUN_TS}"
          OUT="$RUNNER_TEMP/agentdb-bench-${RUN_TS}"
          mkdir -p "$SESSION_DIR" "$OUT"
          GRADE=smoke
          if [[ "$DIST_PROFILE" == "release" ]]; then
            GRADE=release
          fi
          AGENTDB_RUN_AUTHOR_BENCH=1 \
          AGENTDB_AUTHOR_BENCH_GRADE="$GRADE" \
          AGENTDB_DIST_SESSION_DIR="$SESSION_DIR" \
          AGENTDB_AUTHOR_BENCH_OUT="$OUT" \
          bash tools/agentdb-bench/tests/auto/S13_benchmark_claims_remain_reproducible_under_skew_and_noisy_neighbors.sh

      - name: Upload S13 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s13-benchmark-gate
          path: |
            test-sessions/s13-*
            ${{ runner.temp }}/agentdb-bench-*
