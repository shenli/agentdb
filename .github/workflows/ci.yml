# Pull-request CI. The first project-wide automated check —
# previously every PR landed without verification and the human
# reviewer had to remember to `cargo test`.
#
# Linux-only by design. macOS minutes on GH Actions are 10×
# Linux minutes; we don't need OS coverage for build correctness
# (the release workflow handles cross-platform binaries on tag
# push). Linux fast-fails any logic / API regression cheaply.
#
# Two jobs run in parallel:
#
#   * `cargo` — fmt, clippy, full workspace test. The bulk of
#     PR signal.
#   * `sdks` — Python + TypeScript SDK smoke tests against
#     `agentdb serve --dev`. Ensures the public client surface
#     keeps working as the server changes.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight run when a new push lands on the same PR
# branch — saves runner time on noisy PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Reduce log noise from rocksdb's spammy debug output.
  RUST_LOG: warn

jobs:
  cargo:
    name: cargo (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-

      # `cargo fmt --check` is intentionally not enabled yet —
      # the workspace has pre-existing drift across many files
      # and a one-shot `cargo fmt --all` cleanup is a separate
      # follow-up PR (so the diff stays scoped). Re-enable here
      # once that runs.

      - name: cargo clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  sdks:
    name: SDK smoke (Python + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-sdks-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-sdks-${{ runner.os }}-
            cargo-ci-${{ runner.os }}-

      # The SDK smoke tests each spawn `agentdb serve --dev`
      # as a subprocess — they need the debug binary present.
      - name: cargo build (server only)
        run: cargo build -p agentdb-server --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SDK + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e clients/python pytest

      - name: pytest (Python SDK smoke)
        run: pytest clients/python -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install TS SDK deps + build
        working-directory: clients/typescript
        run: |
          npm ci
          npm run build

      - name: npm test (TS SDK smoke)
        working-directory: clients/typescript
        # `npm test` re-runs the build inside the script; that's
        # fast on the warm cache and ensures the test runs
        # against the just-built dist/.
        run: npm test
