# Bounded Linux PR/main checks; distributed chaos and soak remain local/nightly.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_sdks:
        description: "Run Python + TypeScript SDK smoke tests"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Reduce log noise from rocksdb's spammy debug output.
  RUST_LOG: warn
  # Strip debug info from dev + test builds. The workspace
  # depends on rocksdb; with full debug info the `target/`
  # directory clears 14 GB on a clean compile and the GH
  # Actions ubuntu-latest runner only has ~14 GB free out of
  # the box. Stripping debuginfo + flipping incremental off
  # keeps the build well under the cap; CI doesn't need a
  # debugger and `RUST_BACKTRACE=short` still prints frames.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  release-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Install audit tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Public release checks
        run: |
          python3 scripts/check-release-inputs.py
          actionlint -shellcheck=
          python3 scripts/check-secrets.py
          LICENSE_CHECK_STRICT=1 scripts/license-check.sh

  cargo:
    name: cargo (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reclaim disk on the runner. ubuntu-latest ships ~30 GB
      # of pre-installed tooling we don't need (Android SDK,
      # .NET, Haskell, prebuilt CodeQL DBs); leaving them in
      # place + a clean Rust workspace target/ has been enough
      # to ENOSPC mid-compile. Frees ~25 GB in <10s.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      # Install the toolchain pinned in `rust-toolchain.toml`.
      # `rustup show` reads that file and installs the exact
      # channel + components, which keeps local-dev and CI on
      # the same Rust version (no more "the new clippy stable
      # caught a lint on Friday afternoon" surprises).
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup show

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --tests -- -D warnings

      # Testing-evidence contract (docs/testing/testing-evidence-contract.md)
      # rule 6: every auto acceptance script has a unique gated PASS marker.
      - name: acceptance markers unique
        run: ops/testing/check-acceptance-markers.sh

      - name: cargo test
        run: cargo test --workspace --locked

  sdks:
    name: SDK smoke (Python + TypeScript)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_sdks }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Same disk reclaim as the cargo job; agentdb-server's
      # debug build is the heaviest single artifact we produce
      # in this job and easily fills the runner without it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup show

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-sdks-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-sdks-${{ runner.os }}-
            cargo-ci-${{ runner.os }}-

      # The SDK smoke tests each spawn `agentdb serve --dev`
      # as a subprocess — they need the debug binary present.
      - name: cargo build (server and CLI)
        run: cargo build -p agentdb-server -p agentdbctl --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SDK + test deps
        # `[async]` pulls httpx so the AsyncClient smoke tests
        # run; without the extra, those tests are skipped.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'clients/python[async]' pytest

      - name: pytest (Python SDK smoke)
        run: AGENTDB_PYTHON_SMOKE=1 pytest clients/python -q

      - name: Persistent release recovery journey
        run: python scripts/release-smoke.py --bin target/debug/agentdb --ctl target/debug/agentdbctl

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install TS SDK deps + build
        working-directory: clients/typescript
        run: |
          npm ci
          npm run build

      - name: npm test (TS SDK smoke)
        working-directory: clients/typescript
        # `npm test` re-runs the build inside the script; that's
        # fast on the warm cache and ensures the test runs
        # against the just-built dist/.
        run: AGENTDB_TYPESCRIPT_SMOKE=1 npm test
